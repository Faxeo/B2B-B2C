<div class="dashboard-container">
  <app-business-sidebar
    (componentSelected)="selectComponent($event)"
    [class.blurred]="showVehicleForm">
  </app-business-sidebar>

  <div class="main-content">
    @switch (selectedComponent) {
      <!-- Default view -->
      @default {
        <div class="content-area">
          <app-Business-profile></app-Business-profile>
        </div>
      }
      <!-- Component-specific views -->
      @case ('orders-to-receive') {
        <div class="below-content">
          <app-orders-to-receive></app-orders-to-receive>
        </div>
      }
      @case ('orders-to-ship') {
        <div class="below-content">
          <app-orders-to-ship></app-orders-to-ship>
        </div>
      }
      @case ('profile') {
        <div class="below-content">
          <app-Business-profile></app-Business-profile>
        </div>
      }
      @case ('track-order') {
        <div class="below-content">
          <app-track-order></app-track-order>
        </div>
      }
      @case ('purchase-history') {
        <div class="below-content">
          <app-purchase-history></app-purchase-history>
        </div>
      }
      @case ('my-garage') {
        <div class="below-content">
          <app-my-garage (formVisibilityChanged)="updateFormVisibility($event)"></app-my-garage>
        </div>
      }
    }
  </div>
</div>
