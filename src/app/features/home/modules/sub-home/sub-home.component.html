<div class="sub-home-container">
  <div class="categories-list">
    <h2>PRODUCT CATEGORIES</h2>
    @for (category of categories$ | async; track category) {
      <div class="category-wrapper">
        <div class="category-item">
          <img [src]="category.image" [alt]="category.name" class="category-image">
          <span>{{ category.name }}</span>
        </div>
        <div class="subcategories-container">
          <button class="scroll-btn left-btn"
            [class.disabled]="!scrollStates[category.id].canScrollLeft"
            (click)="scrollLeft(category.id)"
            [style.visibility]="scrollStates[category.id].canScrollLeft ? 'visible' : 'hidden'">
            &#8249;
          </button>
          <div class="subcategories-list" #subcatList id="subcat-{{category.id}}">
            @for (subCategory of category.subCategories; track subCategory) {
              <div class="subcategory">
                <span>{{ subCategory.name }}</span>
              </div>
            }
          </div>
          <button class="scroll-btn right-btn"
            [class.disabled]="!scrollStates[category.id].canScrollRight"
            (click)="scrollRight(category.id)"
            [style.visibility]="scrollStates[category.id].canScrollRight ? 'visible' : 'hidden'">
            &#8250;
          </button>
        </div>
      </div>
    }
  </div>
</div>

<app-footer></app-footer>
