<app-navbar class="fixed-top"></app-navbar>

<div class="container">
  <!-- Desktop Left Sidebar -->
  <div class="sidebar" [class.collapsed]="isCollapsed">
    <!-- Keep DOM structure, just toggle visibility -->
    @if (!isCollapsed) {
      <app-filter></app-filter>
    }
  </div>

  <!-- 🆕 Desktop Toggle for Left Sidebar -->
  <button
    class="toggle-btn-2 d-none d-sm-inline-block"
    [class.is-collapsed]="isCollapsed"
    (click)="toggleSidebar()"
    aria-label="Toggle Filter Sidebar"
    >
    <span class="toggle-icon-2">{{ isCollapsed ? '→' : '←' }}</span>
  </button>

  <!-- Mobile Cart Button -->
  <button
    class="mobile-cart-button d-md-none"
    (click)="toggleMobileCart()"
    aria-label="Open Cart"
    >
    <i class="fa fa-shopping-cart"></i>
  </button>

  <!-- Mobile Filter Button -->
  <button
    class="mobile-filter-button d-md-none"
    (click)="toggleMobileFilter()"
    aria-label="Open Filters"
    >
    <i class="fa fa-filter"></i>
  </button>

  <!-- Mobile Cart Overlay -->
  <div
    class="mobile-cart-overlay d-md-none"
    [class.active]="mobileCartOpen"
    (click)="toggleMobileCart()"
  ></div>

  <!-- Mobile Cart Panel -->
  <div
    class="mobile-cart-panel d-md-none"
    [class.active]="mobileCartOpen"
    >
    <div class="mobile-cart-header">
      <button
        class="back-button"
        (click)="toggleMobileCart()"
        aria-label="Go Back"
        >
        <i class="fa fa-arrow-left"></i>
      </button>
      <h2>Shopping Cart</h2>
      <button
        class="close-button"
        (click)="toggleMobileCart()"
        aria-label="Close Cart"
        >
        <i class="fa fa-times"></i>
      </button>
    </div>
    <app-cart-sidebar (closeMobileCart)="toggleMobileCart()"></app-cart-sidebar>
  </div>

  <!-- Mobile Filter Overlay -->
  <div
    class="mobile-filter-overlay d-md-none"
    [class.active]="mobileFilterOpen"
    (click)="toggleMobileFilter()"
  ></div>

  <!-- Mobile Filter Panel -->
  <div
    class="mobile-filter-panel d-md-none"
    [class.active]="mobileFilterOpen"
    >
    <div class="mobile-filter-header">
      <h2>Filters</h2>
      <button
        class="close-button"
        (click)="toggleMobileFilter()"
        aria-label="Close Filters"
        >
        <i class="fa fa-times"></i>
      </button>
    </div>
    <app-filter></app-filter>
  </div>

  <!-- Main Search Results -->
  <div
    class="general-search"
    [class.expanded-left]="isCollapsed"
    [class.expanded-right]="isCartCollapsed"
    >
    <app-search-results></app-search-results>
  </div>

  <!-- Right Sidebar (Cart Sidebar) -->
  <div class="sidebar-cart" [class.collapsed]="isCartCollapsed">
    <app-cart-sidebar></app-cart-sidebar>
  </div>

  <!-- 🆕 Desktop Toggle for Right Cart Sidebar -->
  <button
    class="toggle-btn cart-toggle"
    (click)="toggleCartSidebar()"
    [attr.aria-label]="isCartCollapsed ? 'Open Cart' : 'Close Cart'"
    >
    <span class="toggle-icon">
      <i class="fa" [ngClass]="isCartCollapsed ? 'fa-shopping-cart' : 'fa-times'"></i>
    </span>
  </button>
</div>
