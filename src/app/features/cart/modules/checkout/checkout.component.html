<div class="checkout-container">
  <!-- Logo Section -->
  <div class="text-center mb-4">
    <img 
      src="../../../../../assets/logo.png" 
      alt="Website Logo" 
      class="img-fluid" 
      style="max-height: 80px;"
    />
  </div>
  <h2>Payment Method</h2>
  <!-- Card Payment Section -->
  <form (ngSubmit)="onSubmit()" [formGroup]="checkoutForm" class="payment-form">
    <div *ngIf="!selectedWallet">
      <div id="card-container"></div>
      
      <!-- Submit Button -->
      <button type="button" id="card-button" class="submit-btn" [disabled]="isLoading">
        {{ isLoading ? 'Processing...' : 'Submit Payment' }}
      </button>
    </div>
  </form>
</div>
