<div class="container">
    <header>
      <img src="assets/logo.png" alt="US Auto Parts Logo" class="logo">
      <h1>Customer Login</h1>
    </header>
    <main>
      <form class="login-form" (ngSubmit)="onSubmit()" #loginForm="ngForm">
        <div class="input-group">
          <label for="email">Email:</label>
          <input type="email" id="email" name="email" [(ngModel)]="email" required email #emailInput="ngModel">
          <div *ngIf="emailInput.invalid && (emailInput.dirty || emailInput.touched)" class="error-message">
            <div *ngIf="emailInput.errors?.['required']">Email is required.</div>
            <div *ngIf="emailInput.errors?.['email']">Please enter a valid email address.</div>
          </div>
        </div>
        <div class="input-group">
          <label for="password">Password:</label>
          <div class="password-input">
            <input [type]="showPassword ? 'text' : 'password'" id="password" name="password" [(ngModel)]="password" required>
            <button type="button" (click)="togglePasswordVisibility()" class="toggle-password">
              <i class="fa" [ngClass]="showPassword ? 'fa-eye-slash' : 'fa-eye'"></i>
            </button>
          </div>
                  
        </div>
        <div class="forgot-password">
          <a href="#" class="forgot-password-link">Forgot Password?</a>
        </div>
        <button type="submit" class="login-btn" [disabled]="!loginForm.form.valid">Login</button>
      </form>
      <p class="signup-text">Not registered? <a routerLink="/signup" class="signup-link">Sign up now</a></p>
    </main>
    <footer>
      <p>&copy; 2024 US Auto Parts. All rights reserved.</p>
    </footer>
  </div>
