<div class="filter-container">
  <!-- Back Button -->
  <button class="back-button" (click)="onBackClick()">
    <i class="fa fa-arrow-left back-button" aria-hidden="true"></i>
  </button>
  
  <div>
    <img class="reset" (click)="resetFilters()" src="/assets/reset-1.png" alt="">
  </div>
  
  
  <!-- Filters Section -->
  <div class="filter-section">
    <h3 class="Options" (click)="toggleSection('filters')">
      Filters<i class="fa" [ngClass]="showFilters ? 'fa-minus' : 'fa-plus'"></i>
    </h3>
    <div *ngIf="showFilters">
      <div class="filter-checkbox">
        <label><input type="checkbox"> In Stock</label>
        <span class="count">1000+</span>
      </div>
      <div class="filter-checkbox">
        <label><input type="checkbox"> Top Seller</label>
        <span class="count">1000+</span>
      </div>
      <div class="filter-checkbox">
        <label><input type="checkbox"> Top Rated</label>
        <span class="count">1000+</span>
      </div>
      <div class="filter-checkbox">
        <label><input type="checkbox"> Free Shipping</label>
        <span class="count">1000+</span>
      </div>
    </div>
  </div>
  
  <!-- Category Section -->
  <div class="filter-section">
    <h3 class="Options" (click)="toggleSection('categories')">
      <span>Category</span>
      <i class="fa" [ngClass]="showCategories ? 'fa-minus' : 'fa-plus'"></i>
    </h3>
    <div *ngIf="showCategories">
      <div *ngFor="let category of mainCategories" class="filter-checkbox">
        <div class="category-item">
          <label>
            <input type="checkbox" [(ngModel)]="category.selected" (change)="onMainCategoryChange(category)" />
            {{ category.name }}
          </label>
          <span (click)="toggleSubCategories(category)" class="toggle-icon">
            <i class="fa" [ngClass]="category.showSubCategories ? 'fa-minus' : 'fa-plus'"></i>
          </span>
  
          <!-- First Subcategory Level -->
          <div *ngIf="category.showSubCategories" class="sub-category-section">
            <div *ngFor="let subCategory of category.firstSubCategories" class="filter-checkbox sub-category">
              <label>
                <input type="checkbox" [(ngModel)]="subCategory.selected"
                  (change)="onFirstSubCategoryChange(subCategory)" [disabled]="!category.selected" />
                {{ subCategory.name }}
              </label>
              <span (click)="toggleSecondSubCategories(subCategory)" class="toggle-icon">
                <i class="fa" [ngClass]="subCategory.showSecondSubCategories ? 'fa-minus' : 'fa-plus'"></i>
              </span>
  
              <!-- Second Subcategory Level -->
              <div *ngIf="subCategory.showSecondSubCategories" class="second-sub-category-section">
                <div *ngFor="let secondSubCategory of subCategory.secondSubCategories"
                  class="filter-checkbox nested-sub-category">
                  <label>
                    <input type="checkbox" [(ngModel)]="secondSubCategory.selected"
                      (change)="onSecondSubCategoryChange(subCategory, secondSubCategory)"
                      [disabled]="!subCategory.selected" />
                    {{ secondSubCategory.name }}
                  </label>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  
  
 <!-- Vehicles Section -->
<div class="filter-section">
  <h3 class="Options" (click)="toggleSection('manufacturers')">
    Vehicles
    <span *ngIf="selectedVehicle" class="selected-label">
      {{ selectedVehicle }}
      ({{ selectedModel ? selectedModel : 'All' }})
    </span>
    <i class="fa" [ngClass]="showManufacturers ? 'fa-minus' : 'fa-plus'"></i>
  </h3>

  <div *ngIf="showManufacturers" class="brands-container">
    <input
      type="text"
      class="manufacturer-search"
      placeholder="Search vehicles..."
      [(ngModel)]="searchVehicleTerm"
      (input)="filterVehicles()"
    />

    <!-- For each make -->
    <div *ngFor="let vehicle of filteredVehicles">
      <!-- 1) the make itself -->
      <div class="filter-checkbox">
        <label>
          <input
            type="checkbox"
            [checked]="selectedVehicle === vehicle.value_name && !selectedModel"
            (change)="onVehicleCheckboxChange(vehicle)"
          />
          {{ vehicle.value_name }}
        </label>
      </div>

      <!-- 2) each model prefixed by the make -->
      <div
        *ngFor="let model of vehicle.models"
        class="filter-checkbox nested-sub-category"
      >
        <label>
          <input
            type="checkbox"
            [checked]="
              selectedVehicle === vehicle.value_name &&
              selectedModel === model.value_name
            "
            (change)="onVehicleModelChange(vehicle, model.value_name)"
          />
          {{ vehicle.value_name }} {{ model.value_name }}
        </label>
      </div>
    </div>
  </div>
</div>

  
  <!-- Brands Section -->
  <div class="filter-section">
    <h3 class="Options" (click)="toggleSection('brands')">
      Brands
      <span *ngIf="selectedBrandName" class="selected-label">
        {{ selectedBrandName }}
      </span>
      <i class="fa" [ngClass]="showBrands ? 'fa-minus' : 'fa-plus'"></i>
    </h3>
    <div *ngIf="showBrands" class="brands-container">
      <input type="text" class="brand-search" placeholder="Search brands..." [(ngModel)]="searchTerm"
        (input)="filterBrands()" />
      <!-- Iterate through the brands and create checkboxes -->
      <div *ngFor="let brand of filteredBrands" class="filter-checkbox">
        <label>
          <input type="checkbox" [checked]="selectedBrand === brand.id"
            (change)="onCheckboxChange(brand.id, brand.name)" />
  
          {{ brand.name }}
        </label>
      </div>
    </div>
  </div>
  
  
  <!-- Price Section -->
  <!-- <div class="filter-section">
    <h3 class="Options" (click)="toggleSection('prices')">
      Price <i class="fa" [ngClass]="showPrices ? 'fa-minus' : 'fa-plus'"></i>
    </h3>
    <div *ngIf="showPrices">
      <div class="filter-checkbox">
        <label><input type="checkbox"> &lt; $100</label>
        <span class="count">1000+</span>
      </div>
      <div class="filter-checkbox">
        <label><input type="checkbox"> $100 to $250</label>
        <span class="count">1000+</span>
      </div>
    </div>
  </div> -->
  
  <!-- Material Section -->
  <div class="filter-section">
    <h3 class="Options" (click)="toggleSection('materials')">
      Material <i class="fa" [ngClass]="showMaterials ? 'fa-minus' : 'fa-plus'"></i>
    </h3>
    <div *ngIf="showMaterials">
      <div class="filter-checkbox">
        <label><input type="checkbox"> Steel</label>
        <span class="count">1000+</span>
      </div>
      <div class="filter-checkbox">
        <label><input type="checkbox"> EPDM</label>
        <span class="count">1000+</span>
      </div>
    </div>
  </div>
  </div>
