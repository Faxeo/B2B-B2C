<app-b2c-navbar class="fixed-top"></app-b2c-navbar>

<div class="container">
  <!-- Desktop Left Sidebar -->
  <div class="sidebar" [class.collapsed]="isCollapsed">
    <app-filter *ngIf="!isCollapsed"></app-filter>
  </div>

  <!-- Desktop Toggle Button for Filter Sidebar -->
  <button class="toggle-btn filter-toggle" (click)="toggleSidebar()">
    <span class="toggle-icon">{{ isCollapsed ? '☰' : '✕' }}</span>
  </button>

  <!-- ─── Mobile Cart Button ─── -->
  <!-- Cart button positioned above the filter button -->
  <button
    class="mobile-cart-button d-md-none"
    (click)="toggleMobileCart()"
    aria-label="Open Cart"
  >
    <i class="fa fa-shopping-cart"></i>
  </button>

  <!-- ─── Mobile Filter Icon ─── -->
  <!-- only visible on small screens; use your own utility class or d-md-none -->
  <button
    class="mobile-filter-button d-md-none"
    (click)="toggleMobileFilter()"
    aria-label="Open Filters"
  >
    <i class="fa fa-filter"></i>
  </button>

  <!-- ─── Mobile Cart Overlay ─── -->
  <div
    class="mobile-cart-overlay d-md-none"
    [class.active]="mobileCartOpen"
    (click)="toggleMobileCart()"
  ></div>

  <!-- ─── Mobile Cart Panel ─── -->
  <div
    class="mobile-cart-panel d-md-none"
    [class.active]="mobileCartOpen"
  >
    <div class="mobile-cart-header">
      <button
        class="back-button"
        (click)="toggleMobileCart()"
        aria-label="Go Back"
      >
        <i class="fa fa-arrow-left"></i>
      </button>
      <h2>Shopping Cart</h2>
      <button
        class="close-button"
        (click)="toggleMobileCart()"
        aria-label="Close Cart"
      >
        <i class="fa fa-times"></i>
      </button>
    </div>

    <!-- Reuse your existing desktop cart component with event binding -->
    <app-b2c-cart-sidebar (closeMobileCart)="toggleMobileCart()"></app-b2c-cart-sidebar>
  </div>

  <!-- ─── Mobile Filter Overlay ─── -->
  <div
    class="mobile-filter-overlay d-md-none"
    [class.active]="mobileFilterOpen"
    (click)="toggleMobileFilter()"
  ></div>

  <!-- ─── Mobile Filter Panel ─── -->
  <div
    class="mobile-filter-panel d-md-none"
    [class.active]="mobileFilterOpen"
  >
    <div class="mobile-filter-header">
      <h2>Filters</h2>
      <button
        class="close-button"
        (click)="toggleMobileFilter()"
        aria-label="Close Filters"
      >
        <i class="fa fa-times"></i>
      </button>
    </div>

    <!-- Reuse your existing desktop filter component -->
    <app-filter></app-filter>
  </div>

  <!-- General Search Component -->
  <div class="general-search" [class.expanded-left]="isCollapsed" [class.expanded-right]="isCartCollapsed">
    <app-b2c-general-search></app-b2c-general-search>
  </div> 

  <!-- Right Sidebar (Cart Sidebar) -->
  <div class="sidebar-cart" [class.collapsed]="isCartCollapsed">
    <app-b2c-cart-sidebar></app-b2c-cart-sidebar>
  </div>

    <!-- Desktop Toggle Button for Cart Sidebar -->
  <button
    class="toggle-btn cart-toggle"
    (click)="toggleCartSidebar()"
    aria-label="Toggle Cart"
  >
    <span class="toggle-icon">
      <!-- show shopping-cart when closed, ✕ when open -->
      <i
        class="fa"
        [ngClass]="isCartCollapsed ? 'fa-shopping-cart' : 'fa-times'"
      ></i>
    </span>
  </button>
</div>
