<app-b2c-navbar class="fixed-top"></app-b2c-navbar>

<div class="container">
  <!-- Desktop Left Sidebar -->
  <div class="sidebar" [class.collapsed]="isCollapsed">
    <app-filter *ngIf="!isCollapsed"></app-filter>
  </div>

  <!-- Desktop Toggle Button for Filter Sidebar -->
  <button class="toggle-btn filter-toggle" (click)="toggleSidebar()">
    <span class="toggle-icon">{{ isCollapsed ? '☰' : '✕' }}</span>
  </button>

  <!-- ─── Mobile Filter Icon ─── -->
  <!-- only visible on small screens; use your own utility class or d-md-none -->
  <button
    class="mobile-filter-button d-md-none"
    (click)="toggleMobileFilter()"
    aria-label="Open Filters"
  >
    <i class="fa fa-filter"></i>
  </button>

  <!-- ─── Mobile Filter Overlay ─── -->
  <div
    class="mobile-filter-overlay d-md-none"
    [class.active]="mobileFilterOpen"
    (click)="toggleMobileFilter()"
  ></div>

  <!-- ─── Mobile Filter Panel ─── -->
  <div
    class="mobile-filter-panel d-md-none"
    [class.active]="mobileFilterOpen"
  >
    <div class="mobile-filter-header">
      <h2>Filters</h2>
      <button
        class="close-button"
        (click)="toggleMobileFilter()"
        aria-label="Close Filters"
      >
        <i class="fa fa-times"></i>
      </button>
    </div>

    <!-- Reuse your existing desktop filter component -->
    <app-filter></app-filter>
  </div>

  <!-- General Search Component -->
  <div class="general-search" [class.expanded-left]="isCollapsed" [class.expanded-right]="isCartCollapsed">
    <app-b2c-general-search></app-b2c-general-search>
  </div> 

  <!-- Right Sidebar (Cart Sidebar) -->
  <div class="sidebar-cart" [class.collapsed]="isCartCollapsed" *ngIf="!isCartCollapsed">
    <button class="cancel-btn" (click)="collapseCartSidebar()" aria-label="Close Cart">
      &times;  <!-- "×" Close Icon -->
    </button>
    <app-b2c-cart-sidebar></app-b2c-cart-sidebar>
  </div>
</div>
