<!-- ─── Desktop vehicle search (md and up) ─── -->
<div class="vehicle-search-form-wrapper d-none d-md-block">
  <div class="vehicle-search-form row g-2 align-items-center">
    <!-- Year -->
    <div class="col mobile-col">
      <div class="form-group">
        <select id="year" class="form-select" [(ngModel)]="selectedYear" (change)="onYearChange()">
          <option value="" disabled [selected]="!selectedYear">Year</option>
          @for (year of years; track year) {
            <option [value]="year.year">
              {{ year.year }}
            </option>
          }
        </select>
      </div>
    </div>
    <!-- Make -->
    <div class="col mobile-col">
      <div class="form-group">
        <select id="make" class="form-select" [(ngModel)]="selectedMake" (change)="onMakeChange()"
          [disabled]="!selectedYear">
          <option value="" disabled [selected]="!selectedMake">Make</option>
          @for (make of makes; track make) {
            <option [value]="make.name">
              {{ make.name }}
            </option>
          }
        </select>
      </div>
    </div>
    <!-- Model -->
    <div class="col mobile-col">
      <div class="form-group">
        <select id="model" class="form-select" [(ngModel)]="selectedModel" (change)="onModelChange()"
          [disabled]="!selectedMake">
          <option value="" disabled [selected]="!selectedModel">Model</option>
          @for (model of models; track model) {
            <option [value]="model.name">
              {{ model.name }}
            </option>
          }
        </select>
      </div>
    </div>
    <!-- Trim -->
    <div class="col mobile-col">
      <div class="form-group">
        <select id="trim" class="form-select" [(ngModel)]="selectedTrim" (change)="onTrimChange()"
          [disabled]="!selectedModel">
          <option value="" disabled [selected]="!selectedTrim">Trim</option>
          @for (trim of trims; track trim) {
            <option [value]="trim.name">
              {{ trim.name }}
            </option>
          }
        </select>
      </div>
    </div>
    <!-- Engine -->
    <div class="col mobile-col">
      <div class="form-group">
        <select id="engine" class="form-select" [(ngModel)]="selectedEngine" (change)="onEngineChange()"
          [disabled]="!selectedTrim">
          <option value="" disabled [selected]="!selectedEngine">Engine</option>
          @for (engine of engines; track engine) {
            <option [value]="engine.name">
              {{ engine.name }}
            </option>
          }
        </select>
      </div>
    </div>
    <!-- Search button -->
    <div class="col-auto search-col">
      <button class="btn search-button"
        (click)="onSearchClick(); performVehicleSearch({ year: selectedYear, make: selectedMake, model: selectedModel, trim: selectedTrim, engine: selectedEngine })"
        [disabled]="
          !selectedYear ||
          !selectedMake ||
          !selectedModel ||
          !selectedTrim ||
          !selectedEngine
        ">
        Search
      </button>
    </div>
  </div>
</div>

<!-- ─── Mobile toggle (sm and down) ─── -->
<button class="btn w-100 mb-3 d-block d-md-none" style="color: #1a3056; border-color: #1a3056;"
  (click)="toggleMobileVehicleSearch()" [attr.aria-expanded]="showMobileVehicleSearch">
  Search by Vehicle
</button>


<!-- ─── Mobile bottom‐sheet panel ─── -->
<div class="mobile-vehicle-panel d-md-none" [class.open]="showMobileVehicleSearch">
  <div class="mobile-panel-header">
    <h2>Search Vehicle</h2>
    <button class="close-btn" (click)="toggleMobileVehicleSearch()">×</button>
  </div>
  <div class="mobile-panel-body">
    <!-- Year -->
    <div class="form-group">
      <select id="year-mobile" class="form-select" [(ngModel)]="selectedYear" (change)="onYearChange()">
        <option value="" disabled [selected]="!selectedYear">Year</option>
        @for (year of years; track year) {
          <option [value]="year.year">
            {{ year.year }}
          </option>
        }
      </select>
    </div>
    <!-- Make -->
    <div class="form-group">
      <select id="make-mobile" class="form-select" [(ngModel)]="selectedMake" (change)="onMakeChange()"
        [disabled]="!selectedYear">
        <option value="" disabled [selected]="!selectedMake">Make</option>
        @for (make of makes; track make) {
          <option [value]="make.name">
            {{ make.name }}
          </option>
        }
      </select>
    </div>
    <!-- Model -->
    <div class="form-group">
      <select id="model-mobile" class="form-select" [(ngModel)]="selectedModel" (change)="onModelChange()"
        [disabled]="!selectedMake">
        <option value="" disabled [selected]="!selectedModel">Model</option>
        @for (model of models; track model) {
          <option [value]="model.name">
            {{ model.name }}
          </option>
        }
      </select>
    </div>
    <!-- Trim -->
    <div class="form-group">
      <select id="trim-mobile" class="form-select" [(ngModel)]="selectedTrim" (change)="onTrimChange()"
        [disabled]="!selectedModel">
        <option value="" disabled [selected]="!selectedTrim">Trim</option>
        @for (trim of trims; track trim) {
          <option [value]="trim.name">
            {{ trim.name }}
          </option>
        }
      </select>
    </div>
    <!-- Engine -->
    <div class="form-group">
      <select id="engine-mobile" class="form-select" [(ngModel)]="selectedEngine" (change)="onEngineChange()"
        [disabled]="!selectedTrim">
        <option value="" disabled [selected]="!selectedEngine">Engine</option>
        @for (engine of engines; track engine) {
          <option [value]="engine.name">
            {{ engine.name }}
          </option>
        }
      </select>
    </div>
    <!-- Mobile Search -->
    <button class="btn w-100 mt-3" style="background-color: #1a3056; color: #fff; border-color: #1a3056;" (click)="
        onSearchClick();
        performVehicleSearch({
          year: selectedYear,
          make: selectedMake,
          model: selectedModel,
          trim: selectedTrim,
          engine: selectedEngine
        });
        toggleMobileVehicleSearch()
      " [disabled]="
        !selectedYear ||
        !selectedMake ||
        !selectedModel ||
        !selectedTrim ||
        !selectedEngine
      ">
      Search
    </button>
  </div>
</div>
