<!-- Make sure you have this in your index.html (once) -->
<meta name="viewport" content="width=device-width, initial-scale=1" />

<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm fixed-top py-0" style="z-index:1100">
  <div class="container-fluid px-3 py-2">

    <!-- Logo -->
    <a class="navbar-brand me-auto me-lg-4 d-none d-lg-block" href="/">
      <img src="assets/logo.png" alt="US Auto Parts" height="60" class="navbar-logo">
    </a>

    <!-- Search -->
    <div class="flex-grow-1 view">
      <div class="search-container position-relative w-100">
        <div class="input-group shadow-sm">
          <input id="search-input" #searchInput class="form-control search-input ps-4 pe-5" type="search"
            placeholder="Search for products…" aria-label="Search"
            (keydown.enter)="onSearch()" [value]="searchQuery">
          <button class="btn search-btn px-4" type="button" aria-label="Search" (click)="onSearch()">
            <i class="fa fa-search fa-lg text-white"></i>
          </button>
        </div>
      </div>
    </div>

    <!-- Mobile Toggle Button -->
    <button class="navbar-toggler border-0 p-1" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent"
      aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- Collapsible Menu -->
    <div class="collapse navbar-collapse mt-3 mt-lg-0" id="navbarContent">

      <!-- Action Buttons -->
      <div class="d-flex flex-column flex-lg-row align-items-stretch align-items-lg-center gap-2 gap-lg-3">

        <!-- Navigation Icons -->
        <div class="d-flex gap-2 justify-content-center">
          <button class="btn btn-outline-primary btn-action" routerLink="/B2C/wishlist" aria-label="Wishlist">
            <i class="far fa-heart fa-lg" style="font-size: 28px;"></i>
          </button>
          <button class="btn btn-outline-primary btn-action position-relative" routerLink="/B2C/cart" aria-label="Shopping Cart">
            <i class="fa-solid fa-cart-shopping fa-lg" style="font-size: 28px;"></i>
            <span *ngIf="cartItemCount > 0" class="badge-count bg-primary text-white">{{cartItemCount}}</span>
          </button>
        </div>

        <!-- Login Button -->
        <div class="d-flex flex-column flex-lg-row gap-2">
          <button class="btn btn-primary btn-auth" (click)="openSidebar()">
            <i class="fas fa-user-friends me-2"></i>Login
          </button>
        </div>

      </div>
    </div>
  </div>
</nav>
