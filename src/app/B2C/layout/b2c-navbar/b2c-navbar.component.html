<nav class="navbar navbar-expand-lg">
  <div class="container-fluid">
    <a class="navbar-brand logo" href="/">
      <img src="assets/logo.png" alt="US Auto Parts">
    </a>
    
    <div class="d-flex flex-grow-1 align-items-center justify-content-between">
      <div class="search-bar">
        <input id="search-input" type="search" placeholder="Search for products" (keydown.enter)="onSearch()">
        <button class="search-icon" (click)="onSearch()">
          <i class="fa fa-search"></i>
        </button>
      </div>
    </div>

    <div class="nav-icons">
      <button class="btn heart-btn">
        <i class="far fa-heart"></i>
      </button>
      <button class="btn cart-btn" routerLink="/cart">
        <i class="fa-solid fa-cart-shopping"></i>
        <span *ngIf="cartItemCount > 0" class="cart-count-badge">{{ cartItemCount }}</span>
      </button>
      <button class="btn login-btn" (click)="openSidebar()">
        <i class="fas fa-user-friends"></i>
      </button>
    </div>
  </div>
</nav>
