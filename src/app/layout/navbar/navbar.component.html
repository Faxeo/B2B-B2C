<!-- Make sure you have this in your index.html (once) -->
<meta name="viewport" content="width=device-width, initial-scale=1" />

<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm fixed-top py-0" style="z-index:1100">
  <div class="container-fluid px-3 py-2">


    <!-- Logo -->
    <a class="navbar-brand me-auto me-lg-4 d-none d-lg-block" href="/B2B">
      <img src="assets/logo.png" alt="US Auto Parts" height="60" class="navbar-logo">
    </a>

    <div *ngIf="isAdminSidebarVisible && loginType === 'business'" class="dropdown-menu show shadow-lg border-0"
      style="position: absolute; top: 100%; right: 0; min-width: 220px; z-index: 1050;">
      <div class="dropdown-header bg-danger text-white fw-bold">
        <i class="bi bi-briefcase me-2"></i>Business Account
      </div>
      <a class="dropdown-item py-2 d-flex align-items-center" routerLink="/business-dashboard">
        <i class="bi bi-person-circle me-3 text-primary"></i>Profile
      </a>
      <a class="dropdown-item py-2 d-flex align-items-center" routerLink="/B2B/wishlist">
        <i class="bi bi-heart me-3 text-danger"></i>Wishlist
      </a>
      <a class="dropdown-item py-2 d-flex align-items-center" routerLink="/admin-settings">
        <i class="bi bi-box-seam me-3 text-success"></i>Your Orders
      </a>
      <div class="dropdown-divider"></div>
      <a class="dropdown-item py-2 d-flex align-items-center text-danger" routerLink="/B2B" (click)="logout()">
        <i class="bi bi-box-arrow-right me-3"></i>Logout
      </a>
    </div>

    <div *ngIf="isAdminSidebarVisible && loginType === 'admin'" class="dropdown-menu show shadow-lg border-0"
      style="position: absolute; top: 100%; right: 0; min-width: 200px; z-index: 1050;">
      <div class="dropdown-header bg-danger text-white fw-bold">
        <i class="bi bi-person-gear me-2"></i>Admin Panel
      </div>
      <a class="dropdown-item py-2 d-flex align-items-center" routerLink="/admin-dashboard">
        <i class="bi bi-person-circle me-3 text-primary"></i>Profile
      </a>
      <div class="dropdown-divider"></div>
      <a class="dropdown-item py-2 d-flex align-items-center text-danger" routerLink="/B2B" (click)="logout()">
        <i class="bi bi-box-arrow-right me-3"></i>Logout
      </a>
    </div>
    <!-- Search -->
  <div class="flex-grow-1 view">
    <div class="search-container position-relative w-100">
      <div class="input-group shadow-sm">
        <input id="search-input" #searchInput class="form-control search-input ps-4 pe-5" type="search"
          placeholder="Search parts, brands, vehicles…" aria-label="Search"
          (keydown.enter)="onSearch(); onSearchClick()" [(ngModel)]="navbarSearchTerm">
        <button class="btn search-btn px-4" type="button" aria-label="Search" (click)="onSearch(); onSearchClick()">
          <i class="fa fa-search fa-lg text-white"></i>
        </button>
      </div>
    </div>
  </div>

  <!-- Mobile Toggle Button -->
  <button class="navbar-toggler border-0 p-1" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent"
    aria-expanded="false" aria-label="Toggle navigation">
    <span class="navbar-toggler-icon"></span>
  </button>

    <!-- Collapsible Menu -->
    <div class="collapse navbar-collapse mt-3 mt-lg-0" id="navbarContent">


      <!-- Action Buttons -->
      <div class="d-flex flex-column flex-lg-row align-items-stretch align-items-lg-center gap-2 gap-lg-3">

        <!-- Business-only Icons -->
        <div class="d-flex gap-2 justify-content-center" *ngIf="loginType === 'business'">
          <button class="btn btn-outline-danger btn-action position-relative" routerLink="/garage" aria-label="Garage">
            <i class="fa fa-car fa-lg"></i>
            <span *ngIf="cartItemCount>0" class="badge-count bg-danger">{{cartItemCount}}</span>
          </button>
          <button class="btn btn-outline-danger btn-action" routerLink="/B2B/wishlist" aria-label="Wishlist">
            <i class="fa fa-heart fa-lg"></i>
          </button>
        </div>

        <!-- Login / Business / Admin Buttons -->
        <div class="d-flex flex-column flex-lg-row gap-2">
          <button *ngIf="loginType === 'business'" class="btn btn-danger btn-auth" (click)="toggleAdminSidebar($event)">
            {{ (userService.getUserNameObservable() | async) || null }}
          </button>
          <button *ngIf="!loginType" class="btn btn-outline-danger btn-auth" (click)="openSidebar()">
            Login
          </button>
          <button *ngIf="loginType === 'admin'" class="btn btn-danger btn-auth" (click)="toggleAdminSidebar($event)">
            Admin
          </button>
        </div>

        <!-- Cart Icon (non-admin) -->
        <button *ngIf="loginType !== 'admin'" class="btn btn-danger btn-action position-relative ms-lg-2 me-3"
          routerLink="/B2B/cart" aria-label="Shopping Cart">
          <i class="fa fa-shopping-cart fa-lg"></i>
          <span *ngIf="cartItemCount>0" class="badge-count bg-white text-danger">{{cartItemCount}}</span>
        </button>

      </div>
    </div>
  </div>
</nav>

<!-- Admin / Business Dropdowns (unchanged) -->
<div *ngIf="isAdminSidebarVisible && loginType==='admin'" class="admin-dropdown business-dropdown">
  <ul>
    <li><a routerLink="/admin-dashboard">Profile</a></li>
    <li><a routerLink="/" (click)="logout()">Logout</a></li>
  </ul>
</div>

<div *ngIf="isAdminSidebarVisible && loginType==='business'" class="admin-dropdown business-dropdown">
  <ul>
    <li><a routerLink="/business-dashboard">Profile</a></li>
    <li><a routerLink="/wishlist">Wishlist</a></li>
    <li><a routerLink="/admin-settings">Your Orders</a></li>
    <li><a routerLink="/" (click)="logout()">Logout</a></li>
  </ul>
</div>

<app-sidebar></app-sidebar>
